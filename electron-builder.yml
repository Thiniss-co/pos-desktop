appId: com.electron.app
productName: pos-desktop
directories:
  buildResources: build
# An allowlist: only the production bundles and runtime resources are packaged (electron-builder
# adds package.json and the production node_modules itself). Everything else in the repository --
# docs, tests, scripts, sources, and the Playwright harness build `out/pw-test` with its virtual
# print boundary and fault seams -- stays out. `npm run verify:cp3g5-package` fails on any other path.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - '!out/pw-test/**'
  - '!**/*.map'
  # CP-3G-5 is a source-only live-test harness. Its database, private fixture and authorization
  # material must never cross the application packaging boundary.
  - '!scripts/cp3g5LiveUpload.mjs'
  - '!tests/electron/support/cp3g5/**'
  - '!**/pos-desktop-cp3g5-*'
  - '!**/cp3g5-backend.sqlite'
  - '!**/cp3g5-fixture.json'
asarUnpack:
  - resources/**
win:
  executableName: pos-desktop
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
