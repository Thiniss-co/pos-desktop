appId: com.electron.app
# Display name (shortcuts, installer, window). The data folder does not follow it: a packaged till keeps
# its database under `pos-desktop` (src/main/app/instanceLocation.ts).
productName: Thinis POS
directories:
  buildResources: build
# An allowlist: only the production bundles and runtime resources are packaged (electron-builder
# adds package.json and the production node_modules itself). Everything else in the repository --
# docs, tests, scripts, sources, and the Playwright harness build `out/pw-test` with its virtual
# print boundary and fault seams -- stays out. `npm run verify:cp3g5-package` fails on any other path.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - '!out/pw-test/**'
  - '!**/*.map'
  # CP-3G-5 is a source-only live-test harness. Its database, private fixture and authorization
  # material must never cross the application packaging boundary.
  - '!scripts/cp3g5LiveUpload.mjs'
  - '!tests/electron/support/cp3g5/**'
  - '!**/pos-desktop-cp3g5-*'
  - '!**/cp3g5-backend.sqlite'
  - '!**/cp3g5-fixture.json'
asarUnpack:
  - resources/**
# V1 target: Windows 10 22H2 / Windows 11, x64 only (no ia32/arm64 build). See docs/release/windows.md.
win:
  executableName: pos-desktop
  target:
    - target: nsis
      arch:
        - x64
# Per-user install (%LOCALAPPDATA%\Programs\Thinis POS): a cashier account installs and updates the till
# without an administrator. One-click; an upgrade replaces the program in place. Uninstall removes the
# program and shortcuts only: the till's data (%APPDATA%\pos-desktop: database, settings, protected
# credentials) is kept, so pending sales and refunds are never deleted by an uninstall or reinstall.
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
# macOS: the till uses no camera, microphone, Documents or Downloads access, so it declares none
# (the template's usage strings and its missing build/entitlements.mac.plist are gone). Signing and
# notarization are pending a certificate.
mac:
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # Stable command and install path whatever the display name (/usr/bin/pos-desktop).
  executableName: pos-desktop
  # No snap: it needs snapcraft, and strict confinement blocks the keyring (safeStorage) and CUPS
  # printing the till depends on.
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Office
# electron-builder's default Depends plus ALSA: Electron links libasound.so.2, and a minimal Ubuntu
# 24.04 install has none, so the installed till could not start (found by the container install test).
# Setting `depends` replaces the defaults, so they are restated.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Puts (Windows, when cross-built) and verifies the target-platform better-sqlite3 binary.
afterPack: ./scripts/electronBuilderAfterPack.mjs
# Release fuses: the packaged binary cannot be turned into a Node interpreter (ELECTRON_RUN_AS_NODE,
# NODE_OPTIONS, --inspect) and loads only its own, integrity-checked app.asar (the integrity check is
# enforced on Windows and macOS). Remote debugging is not a fuse; the packaged-app journey drives the
# real artifact through it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish:
  provider: generic
  url: https://example.com/auto-updates
